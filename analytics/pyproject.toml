[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spr-analytics"
version = "0.1.0"
description = "Trade analytics, diagnostics, pair scoring, optimizer and dashboard for the SPR spread-capture bot"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
    "optuna>=3.0",
    "scipy>=1.10",
    "plotly>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
spr-analytics = "spr_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spr_analytics*"]

[tool.setuptools.package-data]
"spr_analytics.dashboard" = ["static/*"]
