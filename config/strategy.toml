# ---------------------------------------------------------------------------
# SPR: базовая конфигурация робота сбора спреда (Bybit linear USDT perpetuals)
# Файл перечитывается ядром на лету (каждые 5 секунд по mtime).
# Пер-символьные переопределения живут в config/overrides.json (пишет оптимизатор).
# ---------------------------------------------------------------------------

[exchange]
category = "linear"
rest_url = "https://api.bybit.com"
ws_url = "wss://stream.bybit.com/v5/public/linear"
# Глубина стакана в подписке: 1 (10 мс), 50 (20 мс), 200/500 (100 мс)
orderbook_depth = 1
# Сколько топиков на одно WebSocket-соединение (2 топика на символ: стакан + сделки)
topics_per_connection = 200
# Сколько аргументов в одном запросе subscribe
args_per_subscribe = 50
# Только символы с quoteCoin = USDT и статусом Trading
quote_coin = "USDT"
# Ограничить список символов (пусто = все). Полезно для тестов: ["BTCUSDT", "ETHUSDT"]
symbols = []
# Максимум символов для подписки (0 = без ограничения)
max_symbols = 0
# Период обновления тикеров (оборот за 24ч) по REST, секунд
tickers_refresh_secs = 300

[fees]
# Комиссии Bybit для деривативов на базовом уровне (VIP0)
maker_rate = 0.0002
taker_rate = 0.00055

[paper]
# Задержка доставки ордера на биржу и отмены, мс
latency_ms = 60
# Начальный капитал бумажного счёта, USDT
initial_equity_usd = 10000.0

[strategy]
# Минимальный спред (bps = 0.01%) между bid и ask, при котором вообще котируем.
# Круг мейкера стоит 2 * 2 bps = 4 bps, поэтому меньше ~8 bps смысла нет.
min_spread_bps = 10.0
# Целевой чистый заработок за круг сверх комиссий, bps
min_edge_bps = 3.0
# Режим котирования:
#   "inside"  — стоим строго внутри спреда вокруг справедливой цены, первыми в очереди; если места нет, сторону не котируем
#   "improve" — на тик внутрь спреда, если он это позволяет, иначе встаём в лучшую цену
#   "join"    — встаём в лучшую цену (за чужой очередью; на неликвидных парах это самые токсичные исполнения)
quote_mode = "inside"
# Для "inside": сохранять не меньше этой доли полуспреда между нашей котировкой и серединой.
# Меньше — больше исполнений, но меньше захват; на синтетике устойчиво работает 0.8–0.9
inside_spread_frac = 0.8
# Размер одного ордера, USDT
order_notional_usd = 100.0
# Максимальная позиция по символу, USDT (при достижении котируем только сторону выхода)
max_position_notional_usd = 300.0
# Смещение котировок при накоплении позиции, bps на 100% лимита позиции
inventory_skew_bps = 4.0
# Минимальный интервал между перестановками ордера по символу, мс
min_requote_ms = 300
# Максимальный возраст неисполненного ордера, мс (после — снять и выставить заново)
max_order_age_ms = 15000
# Максимальное время удержания позиции, секунд, после которого выход становится агрессивнее
max_hold_secs = 120
# Как выходить из "залежавшейся" позиции: "improve" (на тик внутрь) или "taker" (рыночным)
stale_exit_mode = "improve"
# Защита от волатильности: не котировать, если волатильность средней цены за минуту выше, bps
max_vol_bps = 25.0
# Защита от токсичного потока: дисбаланс покупок/продаж за окно, выше которого сторона не котируется
toxicity_imbalance = 0.6
toxicity_window_secs = 10
# --- справедливая цена: котируем вокруг неё, а не вокруг середины спреда ---
# Доля полуспреда, на которую дисбаланс объёмов на лучших уровнях сдвигает справедливую цену (0 = не учитывать)
imbalance_weight = 0.5
# То же для дисбаланса потока сделок за toxicity_window_secs
flow_weight = 0.3
# Доля отклонения референсной площадки (референс + базис − наш mid), добавляемая к справедливой цене
ref_weight = 1.0
# Не котировать сторону вовсе, если референс уже ушёл на столько bps (0 = выкл)
ref_block_bps = 4.0
# Снимать сторону, если справедливая цена уводит её котировку глубже N тиков от лучшего уровня
max_lean_ticks = 3
# Немедленный выход, если mid ушёл против позиции на столько bps (0 = выкл)
stop_loss_bps = 12.0
# Как выходить по стопу: "taker" (рыночным) или "improve" (на тик внутрь)
stop_loss_mode = "taker"

[eligibility]
# Минимальный оборот за 24ч, USDT
min_turnover_24h_usd = 2000000.0
# Минимальная медиана спреда за окно, bps
min_spread_med_bps = 10.0
# Минимальное число сделок в минуту (в режиме inside исполнения не зависят от чужой очереди, порог мягкий)
min_trades_per_min = 1.0
# Минимальное отношение медианного спреда к минутной волатильности
min_spread_vol_ratio = 0.8
# Окно оценки медианы спреда и волатильности, секунд
window_secs = 120
# Сколько символов котируем одновременно (лучшие по score)
max_active_symbols = 40
# Пересчёт списка активных символов, секунд
refresh_secs = 15
# Явные списки (пусто = не используются). Их же пишет analytics pairs в config/symbols.json
allow = []
deny = []
# Онлайн-markout: движение mid через N секунд после наших исполнений (отрицательный = нас переехали)
markout_horizon_secs = 5
# Исключать символ, если средний markout после входов хуже, чем −N bps (0 = выкл)
max_adverse_markout_bps = 3.0
# Сколько исполнений нужно, прежде чем markout влияет на отбор
min_markout_samples = 20

[reference]
# Опережающие площадки: неликвидный перпетуал следует за той же монетой на ликвидной бирже с задержкой.
# Отклонение (референс + базис − наш mid) сдвигает справедливую цену и блокирует сторону, которую снесут.
enabled = true
# Провайдеры в порядке приоритета: "binance_futures", "binance_spot", "bybit_spot"
providers = ["binance_futures", "bybit_spot"]
# Референсная котировка старше этого считается устаревшей, мс. На неликвидных парах референс
# обновляется редко, но остаётся верным, поэтому порог большой; обрыв соединения ловит сам поток.
stale_ms = 30000
symbols_per_connection = 100
# Сглаживание базиса (наш mid − референс), доля на одно обновление
basis_alpha = 0.02

[risk]
# Максимальная суммарная валовая экспозиция по всем символам, USDT
max_gross_exposure_usd = 3000.0
# Максимальная дневная просадка, USDT; при достижении — стоп котирования и выход из позиций
max_daily_loss_usd = 200.0
# Максимум одновременных открытых позиций
max_open_positions = 30

[recording]
enabled = true
# Записывать BBO не чаще, чем раз в N мс на символ (коалесценция); 0 = каждое изменение
bbo_min_interval_ms = 250
# "all" — все подписанные символы, "eligible" — только те, что проходят фильтр
symbols = "all"

[storage]
db_path = "data/spr.db"
md_dir = "data/md"
# Периодичность снимков статистики по символам и PnL, секунд
symbol_stats_interval_secs = 30
pnl_snapshot_interval_secs = 5
